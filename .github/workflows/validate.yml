name: Validate resource manifests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate example against normative schema
        run: python tools/validate_manifest.py
      - name: Run regression and schema-parity tests
        run: python -m unittest discover -s tests -v
      - name: Run starter build
        run: python tools/starter_build.py
